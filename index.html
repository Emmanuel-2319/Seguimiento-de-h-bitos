<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Racha · Seguimiento de Hábitos y Consistencia</title>
    <meta name="description" content="Aplicación web de seguimiento de hábitos, rachas con días de gracia, mapa de consistencia y medallas de hitos." />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Racha" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:title" content="Racha · Seguimiento de Hábitos y Consistencia" />
    <meta property="og:description" content="Monitorea tus compromisos diarios, consistencia y objetivos personales." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      window.__rachaInstallPrompt = null;
      window.__rachaAppInstalled = false;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__rachaInstallPrompt = e;
        window.dispatchEvent(new Event('racha-pwa-prompt-ready'));
      });
      window.addEventListener('appinstalled', function () {
        window.__rachaInstallPrompt = null;
        window.__rachaAppInstalled = true;
        window.dispatchEvent(new Event('racha-pwa-installed'));
      });
    </script>
  </head>
  <body class="bg-black text-white antialiased selection:bg-[#d8f23a] selection:text-black">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
